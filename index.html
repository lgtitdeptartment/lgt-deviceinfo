<!DOCTYPE html>
<html>
<div style="text-align:center;">
<img src="logo.png"
alt="Lewisham and Greenwich NHS Trust"
style="max-width:450px;width:100%;margin-bottom:20px;">
</div>
<head>
    <title>Device Information</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Segoe UI;padding:20px;">

<h1>Device Information</h1>

<pre id="output"></pre>

<script>

const params = new URLSearchParams(window.location.search);
const encoded = params.get('d');

if(encoded)
{
    try
    {
        const jsonText = atob(encoded);

        const device = JSON.parse(jsonText);

        let output = "";

        Object.entries(device).forEach(([key,value]) =>
        {
            output += key.padEnd(20) + ": " + value + "\n";
        });

        document.getElementById("output").textContent = output;
    }
    catch(ex)
    {
        document.getElementById("output").textContent =
            "ERROR: " + ex.message;
    }
}
else
{
    document.getElementById("output").textContent =
        "No device information supplied.";
}

</script>
