<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Device Information</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:#ffffff;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    background:#1e293b;
    border-radius:12px;
    padding:25px;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    color:#22c55e;
}

.subtitle{
    margin-top:10px;
    color:#94a3b8;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:12px;
    border-bottom:1px solid #334155;
}

.label{
    color:#94a3b8;
    font-weight:600;
    width:40%;
}

.value{
    font-weight:500;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#64748b;
    font-size:12px;
}

.error{
    background:#7f1d1d;
    color:white;
    padding:15px;
    border-radius:8px;
}

@media screen and (max-width: 600px){

    td{
        display:block;
        width:100%;
        padding:8px;
    }

    .label{
        border-bottom:none;
        padding-bottom:0;
    }

    .value{
        padding-top:0;
        margin-bottom:10px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1 id="ComputerName">Device Information</h1>
        <div class="subtitle" id="OperatingSystem"></div>
    </div>

    <div class="card">

        <table id="infoTable"></table>

        <div id="error"></div>

    </div>

    <div class="footer">
        Lewisham & Greenwich NHS Trust Device Information
    </div>

</div>
